version: "3.9"

services:
  object-store:
    image: minio/minio
    container_name: object-store
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    command: [ "server", "/data", "--console-address", ":9001" ]
    ports:
      - "9000:9000"
      - "9001:9001"
    restart: always
    volumes:
      - minio_data:/data
    # networks:
    #   - discord_network

  minio-init:
    image: minio/mc
    container_name: minio-init
    depends_on:
      object-store:
        condition: service_started
    entrypoint: >
      /bin/sh -c " until mc alias set minio http://object-store:9000
      ${MINIO_USER} ${MINIO_PASSWORD}; do
        sleep 2;
      done; mc mb -p minio/warehouse || true; mc mb -p minio/crawled-data ||
      true; mc mb -p minio/user_resume || true; echo 'MinIO initialization
      completed'; "
    restart: "no"
    # networks:
    #   - discord_network
