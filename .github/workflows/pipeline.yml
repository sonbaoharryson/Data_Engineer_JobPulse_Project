name: CI Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==================== LINT ====================
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - run: |
          pip install black flake8 isort ruff
          black --check airflow/ api/ bot/ --exclude 'bot/bot_venv|api/\.venv_api|airflow/\.venv'
          isort --check-only airflow/ api/ bot/ --skip bot/bot_venv --skip api/.venv_api --skip airflow/.venv
          flake8 airflow/ api/ bot/ --max-line-length=120 --exclude bot/bot_venv,api/.venv_api,airflow/.venv
          ruff check airflow/ api/ bot/ --exclude bot/bot_venv,api/.venv_api,airflow/.venv

  # ==================== TEST ====================
  test:
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - run: |
          pip install pytest pytest-cov pytest-asyncio
          pip install -r airflow/requirements.txt
          pip install -r api/requirements.txt
          pip install -r bot/requirements.txt

      - run: |
          pytest airflow/scripts/test/ --maxfail=1 --disable-warnings

  # ==================== DOCKER BUILD ====================
  build:
    runs-on: ubuntu-latest
    needs: [lint, test]

    strategy:
      matrix:
        service: [airflow, api, bot]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v2

      - uses: docker/login-action@v2
        if: github.event_name == 'push'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v4
        with:
          context: ./${{ matrix.service }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/job-pulse-${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==================== INTEGRATION TEST ====================
  integration-test:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Start services
        run: docker compose up --build -d --wait

      - name: Health check
        run: |
          for i in {1..30}; do
            curl -f http://localhost:8000/health && break || sleep 2
          done

      - name: Test API
        run: curl -f http://localhost:8000/api/jobs

      - name: Cleanup
        if: always()
        run: docker compose down
