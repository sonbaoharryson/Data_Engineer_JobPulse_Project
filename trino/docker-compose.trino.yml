version: "3.9"

services:
  trino-coordinator:
    image: trinodb/trino:latest
    container_name: trino-coordinator
    depends_on:
      minio-init:
        condition: service_completed_successfully
      postgresql_db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: ${DB_HOST}
      POSTGRES_PORT: ${DB_PORT}
      POSTGRES_DB: ${DB_TRINO}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      MINIO_USER: ${MINIO_USER}
      MINIO_PASSWORD: ${MINIO_PASSWORD}
    ports:
      - "8081:8080"
    volumes:
      - ./catalog:/etc/trino/catalog
      - ./etc/jvm.config:/etc/trino/jvm.config
      - ./etc/coordinator/config.properties:/etc/trino/config.properties
      - ./etc/coordinator/node-coordinator.properties:/etc/trino/node.properties
    restart: always

  trino-worker:
    image: trinodb/trino:latest
    depends_on:
      trino-coordinator:
        condition: service_started
    environment:
      POSTGRES_HOST: ${DB_HOST}
      POSTGRES_PORT: ${DB_PORT}
      POSTGRES_DB: ${DB_TRINO}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      MINIO_USER: ${MINIO_USER}
      MINIO_PASSWORD: ${MINIO_PASSWORD}
    volumes:
      - ./catalog:/etc/trino/catalog
      - ./etc/jvm.config:/etc/trino/jvm.config
      - ./etc/worker/worker-config.properties:/etc/trino/config.properties
      - ./etc/worker/node-worker.properties:/etc/trino/node.properties
    restart: always
    deploy:
      replicas: 2

  trino-init:
    image: trinodb/trino:latest
    container_name: trino-init
    depends_on:
      trino-coordinator:
        condition: service_started
      postgresql_db:
        condition: service_healthy
    volumes:
      - ./init_schema:/init_schema
    entrypoint: >
      /bin/sh -c "
      echo 'Waiting for Trino...';
      until trino --server http://trino-coordinator:8080 --execute 'SELECT 1'; do
        sleep 3;
      done;

      echo 'Running init_schema.sql';
      trino --server http://trino-coordinator:8080 --file /init_schema/init_schema.sql;
      echo 'Init schema completed';
      "
    restart: "no"
