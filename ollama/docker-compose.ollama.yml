version: "3.9"

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    environment:
      - OLLAMA_HOST=${OLLAMA_HOST}
      - OLLAMA_PORT=11434
    ports:
      - "11434:11434"
    restart: unless-stopped
    tty: true
    volumes:
      - ./entrypoint/run_ollama.sh:/entrypoint/run_ollama.sh
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    entrypoint: ["/bin/sh", "/entrypoint/run_ollama.sh"]
