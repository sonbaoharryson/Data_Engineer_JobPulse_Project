name: Dependabot PR Checks

on:
  pull_request:
    branches: [ main, develop ]

# Only run for dependabot PRs
jobs:
  dependabot-checks:
    name: Lightweight Checks for Dependabot
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install safety bandit

      - name: Run Safety check on dependencies
        run: |
          pip install -r airflow/requirements.txt -q
          safety check --json || echo "Safety check completed"

      - name: Basic syntax check
        run: |
          python -m py_compile airflow/dags/*.py || echo "DAG syntax check completed"
          python -c "import api.app; print('API import successful')" || echo "API import check completed"
          python -c "import bot.bot; print('Bot import successful')" || echo "Bot import check completed"

      - name: Auto-approve dependabot PRs
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        uses: juliangruber/approve-pull-request-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          number: ${{ github.event.pull_request.number }}
